# 发版流水线（构建+发布准备）：由 /release skill 负责版本号、撰写发行日志并提交；
# 本工作流承担确定性动作——校验、三平台构建、创建草稿发行页、上传产物。
# 触发方式：手动触发（workflow_dispatch），仅允许从 main 分支执行；
# 构建完成直接建草稿、传资产（用 GITHUB_TOKEN 创建 release/tag）。
# 草稿不通知关注者；发布（--draft=false）由用户测试确认后执行，那一刻才发出通知。
name: Release

on:
  # 手动触发（Actions UI → Run workflow），版本提交后从 main 分支执行
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify (Windows)
    runs-on: windows-latest
    steps:
      - name: 仅允许从 main 分支发行
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          [ "$RELEASE_REF" = "refs/heads/main" ] || {
            echo "::error::发行工作流只能从 main 分支触发（当前：$RELEASE_REF）"
            exit 1
          }
      - uses: actions/checkout@v7
      # 第 0 秒拦截：VERSION 非空、CHANGELOG 中存在对应版本段落，
      # 不满足直接失败，避免浪费三平台构建
      - name: 校验 VERSION 与 CHANGELOG 段落
        shell: bash
        run: |
          VERSION="$(cat VERSION)"
          [ -n "$VERSION" ] || { echo "::error::VERSION 文件为空"; exit 1; }
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "::error::CHANGELOG.md 缺少 ## [$VERSION] 段落（需由 /release skill 先提交）"; exit 1; }
      - run: corepack enable
        shell: bash
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: rustup component add rustfmt clippy
        shell: bash
        working-directory: src-tauri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  build:
    needs: verify
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            upload-paths: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          - name: macos-arm64
            os: macos-latest
            rust-target: aarch64-apple-darwin
            upload-paths: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macos-x64
            os: macos-latest
            rust-target: x86_64-apple-darwin
            upload-paths: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
        shell: bash
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # 必须在 src-tauri 下执行：rust-toolchain.toml 固定了工具链，目标要装到该工具链
      - run: rustup target add ${{ matrix.rust-target }}
        shell: bash
        working-directory: src-tauri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --target ${{ matrix.rust-target }}
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.name }}
          # 只上传安装包产物，避免把 .app 内的图标/脚本等打包文件一并传进发行页
          path: ${{ matrix.upload-paths }}
          retention-days: 1
          if-no-files-found: error

  release:
    # 校验和所有平台构建成功后才会执行；任何失败都不会创建发行
    needs: build
    # 手动触发执行：构建完直接把资产收进草稿。
    # tag 不存在时，由 gh release create 自动创建（--target 指向本次 commit）；
    # 用 GITHUB_TOKEN 创建 release/tag 不会再次触发本工作流（官方防递归机制）。
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      # 日志由 /release skill 写入 CHANGELOG.md 并随提交带进仓库；
      # 这里用 awk 按标题格式提取当前版本段落作为发行说明；已存在草稿（重跑场景）则更新，已公开则拒绝改动
      - name: 创建草稿发行页
        run: |
          TAG="v$VERSION"
          NOTES="$(mktemp)"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { insec = 1 }
            insec && /^## \[/ && index($0, "## [" v "]") != 1 { exit }
            insec { print }
          ' CHANGELOG.md > "$NOTES"
          [ -s "$NOTES" ] || { echo "::error::CHANGELOG.md 缺少 ## [$VERSION] 段落（需由 /release skill 先提交）"; exit 1; }
          STATE="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || true)"
          if [ -z "$STATE" ]; then
            gh release create "$TAG" --draft --title "CGswitch $TAG" --notes-file "$NOTES" --target "$GITHUB_SHA"
          elif [ "$STATE" = true ]; then
            gh release edit "$TAG" --title "CGswitch $TAG" --notes-file "$NOTES"
          else
            echo "::error::发行 $TAG 已经公开，拒绝修改已发布内容；请先递增 VERSION。"
            exit 1
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: 整理发行资产名称
        run: |
          mkdir -p release-assets
          cp artifacts/bundle-windows-x64/nsis/*.exe "release-assets/CGswitch-v$VERSION-Windows-setup.exe"
          cp artifacts/bundle-windows-x64/msi/*.msi "release-assets/CGswitch-v$VERSION-Windows.msi"
          cp artifacts/bundle-macos-x64/*.dmg "release-assets/CGswitch-v$VERSION-macOS-x64.dmg"
          cp artifacts/bundle-macos-arm64/*.dmg "release-assets/CGswitch-v$VERSION-macOS-arm64.dmg"
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: 上传产物到草稿
        run: gh release upload "v$VERSION" release-assets/* --clobber
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
      # 到此为止：草稿就绪（含全部资产与日志），等待用户测试确认后发布；
      # 发布动作由 /release skill 执行 gh release edit --draft=false。
