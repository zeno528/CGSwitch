# 发版流水线（构建部分）：由 /release skill 在本地完成版本号、发行日志和 tag，
# 推送 tag 自动触发本工作流；这里只做确定性的事——
# 第 0 秒校验 tag 与 VERSION 一致、发行日志存在，然后三平台构建，
# 全部成功后以草稿创建发行页并上传产物。
# 草稿不通知关注者；发布（--draft=false）由用户测试确认后执行，那一刻才发出通知。
name: Release

on:
  push:
    tags: ["v*"]
  # 手动触发（Actions UI → Run workflow 可选分支），用于在打 tag 前预演或重跑
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # 第 0 秒拦截：tag 与 VERSION 不一致、或发行日志缺失时直接失败，不浪费三平台构建
      - name: 校验 tag、VERSION 与发行日志
        shell: bash
        run: |
          VERSION="$(cat VERSION)"
          # 手动触发（分支）无 tag 概念，跳过 tag/VERSION 一致性及发行日志校验
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ -n "$VERSION" ] || { echo "::error::VERSION 文件为空"; exit 1; }
            exit 0
          fi
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 VERSION（$VERSION）不一致"
            exit 1
          fi
          NOTES="docs/release-notes/v$VERSION.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::缺少发行日志 $NOTES"
            exit 1
          fi
      - run: corepack enable
        shell: bash
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: rustup component add rustfmt clippy
        shell: bash
        working-directory: src-tauri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  build:
    needs: verify
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            upload-paths: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          - name: macos-arm64
            os: macos-latest
            rust-target: aarch64-apple-darwin
            upload-paths: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macos-x64
            os: macos-latest
            rust-target: x86_64-apple-darwin
            upload-paths: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
        shell: bash
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # 必须在 src-tauri 下执行：rust-toolchain.toml 固定了工具链，目标要装到该工具链
      - run: rustup target add ${{ matrix.rust-target }}
        shell: bash
        working-directory: src-tauri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --target ${{ matrix.rust-target }}
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.name }}
          # 只上传安装包产物，避免把 .app 内的图标/脚本等打包文件一并传进发行页
          path: ${{ matrix.upload-paths }}
          retention-days: 1
          if-no-files-found: error

  release:
    # 校验和所有平台构建成功后才会执行；任何失败都不会创建发行
    needs: build
    # 手动触发（分支）无 tag 可发，跳过草稿发行页与资产上传
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      # 日志由 /release skill 生成并随 tag 提交；已存在草稿（重跑场景）则更新，已公开则拒绝改动
      - name: 创建草稿发行页
        run: |
          TAG="v$VERSION"
          NOTES="docs/release-notes/v$VERSION.md"
          STATE="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || true)"
          if [ -z "$STATE" ]; then
            gh release create "$TAG" --draft --title "CGswitch $TAG" --notes-file "$NOTES"
          elif [ "$STATE" = true ]; then
            gh release edit "$TAG" --title "CGswitch $TAG" --notes-file "$NOTES"
          else
            echo "::error::发行 $TAG 已经公开，拒绝修改已发布内容；请先递增 VERSION。"
            exit 1
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: 整理发行资产名称
        run: |
          mkdir -p release-assets
          cp artifacts/bundle-windows-x64/*.exe "release-assets/CGswitch-v$VERSION-Windows-setup.exe"
          cp artifacts/bundle-windows-x64/*.msi "release-assets/CGswitch-v$VERSION-Windows.msi"
          cp artifacts/bundle-macos-x64/*.dmg "release-assets/CGswitch-v$VERSION-macOS-x64.dmg"
          cp artifacts/bundle-macos-arm64/*.dmg "release-assets/CGswitch-v$VERSION-macOS-arm64.dmg"
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: 上传产物到草稿
        run: gh release upload "v$VERSION" release-assets/* --clobber
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
      # 到此为止：草稿就绪（含全部资产与日志），等待用户测试确认后发布；
      # 发布动作由 /release skill 执行 gh release edit --draft=false。
