# 手动发行：Actions → Release → Run workflow
# 版本号取自仓库根目录 VERSION 文件，打 tag 为 v{VERSION}；
# 三个平台全部构建成功后，才创建标签和发行页并上传产物（避免发行页先建好却没有产物的误导）；
# 产物以 prerelease（预发布）状态发布，测试通过后手动改为正式版。
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: verify (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
        shell: bash
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: rustup component add rustfmt clippy
        shell: bash
        working-directory: src-tauri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  build:
    needs: verify
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            upload-paths: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          - name: macos-arm64
            os: macos-latest
            rust-target: aarch64-apple-darwin
            upload-paths: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macos-x64
            os: macos-latest
            rust-target: x86_64-apple-darwin
            upload-paths: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
        shell: bash
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # 必须在 src-tauri 下执行：rust-toolchain.toml 固定了工具链，目标要装到该工具链
      - run: rustup target add ${{ matrix.rust-target }}
        shell: bash
        working-directory: src-tauri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --target ${{ matrix.rust-target }}
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.name }}
          # 只上传安装包产物，避免把 .app 内的图标/脚本等打包文件一并传进发行页
          path: ${{ matrix.upload-paths }}
          retention-days: 1
          if-no-files-found: error

  release:
    # 校验和所有平台构建成功后才会执行；任何失败都不会创建发行
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: 生成项目更新日志并创建草稿预发布
        run: |
          TAG="v$VERSION"
          # 取最近一个已发布版本（排除当前要发的 tag），用于生成对比日志
          PREV="$(gh release list --limit 30 --json tagName -q '.[].tagName' | grep -v "^${TAG}$" | head -1 || true)"
          NOTES="$RUNNER_TEMP/release-notes.md"
          if [ -n "$PREV" ]; then
            RANGE="$PREV..HEAD"
          else
            RANGE="HEAD"
          fi
          # 只保留包含项目代码/资源的提交；README、文档、工作流等提交不进入发行说明
          is_project_commit() {
            local sha="$1" changed_files project_files
            changed_files="$(git diff-tree --root --no-commit-id --name-only -r "$sha")"
            project_files="$(printf '%s\n' "$changed_files" \
              | grep -Ev '^$|(^|/)(README[^/]*|LICENSE[^/]*)$|(^|/)docs/|\.md$|^\.github/|^\.codex/|(^|/)AGENTS\.md$|(^|/)VERSION$' \
              || true)"
            [[ -n "$project_files" ]]
          }

          # 清洗：去掉提交哈希、gitmoji、feat/fix 等类型前缀与 scope，只留用户能看懂的描述
          # LC_ALL=C 按字节处理，避免多字节 emoji 在部分 locale 下剥不干净
          fmt() {
            LC_ALL=C sed -E 's/^[0-9a-f]{7,} //' \
              | LC_ALL=C sed -E 's/^[^[:space:]]+[[:space:]]*//' \
              | LC_ALL=C sed -E 's/^(feat|fix|chore|refactor|style|docs|perf|test|build|ci|release|ui|security|revert)(\([^)]*\))?:[[:space:]]*//' \
              | LC_ALL=C sed -E 's/[[:space:]]+$//' \
              | sed 's/^/- /'
          }
          # 只收对用户可见的变更；空分类不输出；重复条目只留一条
          section() {
            local pattern="$1" title="$2" entries sha subject
            entries="$(
              while IFS=$'\t' read -r sha subject; do
                [[ -z "$sha" ]] && continue
                if printf '%s\n' "$subject" | grep -qiE '更新版本号|README|LICENSE|文档|依赖|dependenc|(^|[^[:alnum:]])deps([^[:alnum:]]|$)|pnpm[[:space:]]check|(^|[^[:alnum:]])CI([^[:alnum:]]|$)|workflow|工作流'; then
                  continue
                fi
                is_project_commit "$sha" || continue
                printf '%s\n' "$subject"
              done < <(git log --format='%H%x09%s' --no-merges -E --grep="$pattern" "$RANGE") \
                | fmt | awk '!seen[$0]++'
            )"
            if [ -n "$entries" ]; then
              printf '### %s\n%s\n\n' "$title" "$entries"
            fi
          }
          {
            section '^(✨)' '✨ 新增'
            section '^(🐛|🚑)' '🐛 修复'
            section '^(💄|🎨)' '💄 界面与样式'
            section '^(⚡)' '⚡ 性能优化'
            section '^(♻️)' '♻️ 重构'
            section '^(🔥)' '🔥 移除'
            section '^(🔒)' '🔒 安全'
          } > "$NOTES"
          if [ ! -s "$NOTES" ]; then
            echo '没有可发布的项目变更，停止发行。'
            exit 1
          fi

          RELEASE_STATE="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || true)"
          if [ -z "$RELEASE_STATE" ]; then
            gh release create "$TAG" --draft --prerelease --notes-file "$NOTES" --target "$GITHUB_SHA"
            RELEASE_STATE=true
          elif [ "$RELEASE_STATE" = true ]; then
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            echo "发行 $TAG 已经公开，停止修改已发布内容；请先递增 VERSION。"
            exit 1
          fi

          echo "release_state=$RELEASE_STATE" >> "$GITHUB_ENV"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: 上传产物到预发布
        run: gh release upload "v$VERSION" $(find artifacts -type f) --clobber
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
      - name: 发布预发布
        if: env.release_state == 'true'
        run: gh release edit "v$VERSION" --draft=false --prerelease
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
